<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d7dde3"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#0d1117"/>
  <text x="480" y="34" fill="#d7dde3" font-size="20" font-weight="bold" text-anchor="middle">IFTS · Setup A — Sweep Reversal (schema canonico, long)</text>
  <text x="480" y="56" fill="#78848f" font-size="12" text-anchor="middle">tempo → · solo in Kill Zone · eventi confermati a chiusura barra</text>

  <!-- pools -->
  <line x1="60" y1="120" x2="900" y2="120" stroke="#ef5350" stroke-width="1" stroke-dasharray="6 4" opacity="0.8"/>
  <text x="66" y="112" fill="#ef5350" font-size="12">PDH / DOL — buyside liquidity (TARGET · TP2)</text>
  <line x1="60" y1="390" x2="560" y2="390" stroke="#f5b041" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="66" y="408" fill="#f5b041" font-size="12">PDL + London Low — pool sell-side (rank ≥ 4)</text>
  <line x1="60" y1="255" x2="900" y2="255" stroke="#b0bec5" stroke-width="1" stroke-dasharray="2 5" opacity="0.7"/>
  <text x="838" y="247" fill="#b0bec5" font-size="12">EQ 50% (TP1)</text>
  <text x="838" y="273" fill="#78848f" font-size="11">discount ↓</text>

  <!-- price path -->
  <path d="M 80 200 L 150 260 L 200 235 L 260 310 L 310 285 L 370 430 L 420 350 L 455 372 L 505 250 L 545 305 L 585 292 L 640 210 L 690 240 L 760 160 L 830 185 L 890 125"
        fill="none" stroke="#d7dde3" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- sweep zone -->
  <circle cx="370" cy="430" r="26" fill="none" stroke="#f5b041" stroke-width="2"/>
  <text x="370" y="475" fill="#f5b041" font-size="13" text-anchor="middle" font-weight="bold">① SWEEP (P6)</text>
  <text x="370" y="492" fill="#78848f" font-size="11" text-anchor="middle">wick oltre il pool + close di ritorno ≤ 3 barre</text>

  <!-- MSS -->
  <line x1="430" y1="310" x2="560" y2="310" stroke="#26a69a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="565" y="314" fill="#26a69a" font-size="12" font-weight="bold">② MSS ▲</text>
  <text x="565" y="330" fill="#78848f" font-size="11">close &gt; swing con displacement ≥ 1.5× body</text>

  <!-- FVG entry zone -->
  <rect x="500" y="330" width="120" height="34" fill="#26a69a" opacity="0.18" stroke="#26a69a" stroke-width="1"/>
  <line x1="500" y1="347" x2="620" y2="347" stroke="#26a69a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="628" y="344" fill="#26a69a" font-size="12" font-weight="bold">③ FVG del displacement</text>
  <text x="628" y="360" fill="#78848f" font-size="11">limit al CE (50% del gap) · in discount + OTE</text>

  <!-- entry/stop/target markers -->
  <line x1="480" y1="347" x2="500" y2="347" stroke="#26a69a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="410" y="351" fill="#26a69a" font-size="12" font-weight="bold">ENTRY</text>
  <line x1="330" y1="462" x2="620" y2="462" stroke="#ef5350" stroke-width="1.5"/>
  <text x="628" y="466" fill="#ef5350" font-size="12" font-weight="bold">STOP = sweep low − buffer (P16)</text>

  <!-- R:R note -->
  <rect x="660" y="352" width="236" height="120" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="678" y="378" fill="#d7dde3" font-size="13" font-weight="bold">Geometria (V6/V7)</text>
  <text x="678" y="400" fill="#78848f" font-size="12">R:R ex-ante ≥ 2.0 al DOL</text>
  <text x="678" y="420" fill="#78848f" font-size="12">TP1 = EQ → ⅓ + stop a BE</text>
  <text x="678" y="440" fill="#78848f" font-size="12">TP2 = DOL → ⅓</text>
  <text x="678" y="460" fill="#78848f" font-size="12">Runner: trail su swing M5</text>

  <!-- grading -->
  <text x="80" y="522" fill="#78848f" font-size="12">Grade: +1 SMT al raid · +1 multi-pool · +1 pool weekly · +0.5 VWAP reclaim · +0.5 zona composita → B / A / A+ ⇒ size 0.25 / 0.35 / 0.50%</text>
</svg>
