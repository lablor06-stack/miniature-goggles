<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78848f"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#0d1117"/>
  <text x="480" y="36" fill="#d7dde3" font-size="20" font-weight="bold" text-anchor="middle">IFTS · Architettura a 4 piani con feedback loop</text>

  <!-- Plane 1 Knowledge -->
  <rect x="60" y="70" width="380" height="150" rx="10" fill="#161b22" stroke="#2962ff" stroke-width="1.5"/>
  <text x="80" y="98" fill="#2962ff" font-size="14" font-weight="bold">1 · CONOSCENZA — Research/</text>
  <text x="80" y="122" fill="#d7dde3" font-size="12">Microstruttura · AMT · Profile · VWAP · Order Flow</text>
  <text x="80" y="142" fill="#d7dde3" font-size="12">Struttura · Liquidità · Zone · P/D · Tempo · SMT</text>
  <text x="80" y="168" fill="#78848f" font-size="11">Gerarchia di evidenza E1–E4 · 10 Research Questions</text>
  <text x="80" y="188" fill="#78848f" font-size="11">Vincoli di progettazione V1–V8</text>

  <!-- Plane 2 Decision -->
  <rect x="520" y="70" width="380" height="150" rx="10" fill="#161b22" stroke="#26a69a" stroke-width="1.5"/>
  <text x="540" y="98" fill="#26a69a" font-size="14" font-weight="bold">2 · DECISIONE — Strategy/ + Manual/</text>
  <text x="540" y="122" fill="#d7dde3" font-size="12">10 candidate → matrice pesata → Core Model</text>
  <text x="540" y="142" fill="#d7dde3" font-size="12">Setup A (reversal) · B (continuation) · C (PM)</text>
  <text x="540" y="168" fill="#78848f" font-size="11">Regole R1–R20 · checklist · rischio P11–P17</text>
  <text x="540" y="188" fill="#78848f" font-size="11">Psicologia: tassonomia errori E/C/S + protocolli</text>

  <!-- Plane 3 Execution -->
  <rect x="520" y="280" width="380" height="150" rx="10" fill="#161b22" stroke="#ff9800" stroke-width="1.5"/>
  <text x="540" y="308" fill="#ff9800" font-size="14" font-weight="bold">3 · ESECUZIONE — Pine/ (v6)</text>
  <text x="540" y="332" fill="#d7dde3" font-size="12">IFTS_Master (12 engine, Signal A/B, dashboard)</text>
  <text x="540" y="352" fill="#d7dde3" font-size="12">6 moduli standalone · 17 alert · stats RQ on-chart</text>
  <text x="540" y="378" fill="#78848f" font-size="11">Zero repaint logico · lookahead_off · ET pinned</text>
  <text x="540" y="398" fill="#78848f" font-size="11">Caps FIFO · dynamic requests · moduli toggleabili</text>

  <!-- Plane 4 Measure -->
  <rect x="60" y="280" width="380" height="150" rx="10" fill="#161b22" stroke="#ab47bc" stroke-width="1.5"/>
  <text x="80" y="308" fill="#ab47bc" font-size="14" font-weight="bold">4 · MISURA — Testing/ + Journal/ + Statistics/</text>
  <text x="80" y="332" fill="#d7dde3" font-size="12">Journal CSV (30 campi) → kpi_calculator.py</text>
  <text x="80" y="352" fill="#d7dde3" font-size="12">monte_carlo.py (bootstrap iid+block, ruin)</text>
  <text x="80" y="378" fill="#78848f" font-size="11">Protocollo S1–S4 · WFA · soglie pre-registrate</text>
  <text x="80" y="398" fill="#78848f" font-size="11">Kill-switch: exp &lt; 0.1R o DD &gt; P95 MC → audit</text>

  <!-- arrows -->
  <line x1="440" y1="145" x2="514" y2="145" stroke="#78848f" stroke-width="2" marker-end="url(#a2)"/>
  <text x="477" y="135" fill="#78848f" font-size="10" text-anchor="middle">E≥3 → regole</text>
  <line x1="710" y1="220" x2="710" y2="274" stroke="#78848f" stroke-width="2" marker-end="url(#a2)"/>
  <text x="722" y="250" fill="#78848f" font-size="10">mappatura 1:1</text>
  <line x1="514" y1="355" x2="446" y2="355" stroke="#78848f" stroke-width="2" marker-end="url(#a2)"/>
  <text x="480" y="345" fill="#78848f" font-size="10" text-anchor="middle">dashboard → journal</text>
  <line x1="250" y1="274" x2="250" y2="226" stroke="#ab47bc" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="262" y="252" fill="#ab47bc" font-size="11" font-weight="bold">feedback: KPI → RQ → parametri (R19)</text>

  <text x="480" y="470" fill="#78848f" font-size="12" text-anchor="middle">Il loop è chiuso: la misura ri-alimenta la conoscenza · una modifica per volta, versionata, mai in drawdown emotivo</text>
</svg>
